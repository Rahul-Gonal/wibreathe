# WiBreathe CI Workflow: Multi-OS Cross-Platform Testing
# UNVERIFIED: This workflow has not been executed on GitHub Actions runners yet.
name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    continue-on-error: ${{ matrix.python-version == '3.14' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest test suite
        run: |
          pytest -q

  cli-smoke-test:
    name: CLI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify CLI --help
        run: |
          python -m wibreathe --help

      - name: Verify simulate and replay commands
        run: |
          python -m wibreathe simulate --duration 5 --output sim_test.csv --labels labels_test.csv
          python -m wibreathe replay --file sim_test.csv --fast
