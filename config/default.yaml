# WiBreathe Configuration File
# Target: Classic ESP32 DevKit V1 (ESP-32D, 4MB Flash)
# All time durations are in seconds, frequencies in Hertz.

system:
  device_id: "wibreathe-node-01"
  sample_rate_hz: 50.0          # Incoming packet rate from transmitter
  uniform_rate_hz: 20.0         # Resampled uniform DSP rate
  baud_rate: 921600
  serial_timeout_sec: 1.0
  reconnect_delay_sec: 2.0
  max_queue_size: 2000

subcarriers:
  raw_subcarrier_count: 64      # 64 subcarriers for HT20 bandwidth
  layout: "lltf_ht20"           # lltf_ht20 or htltf_ht20
  # UNVERIFIED on hardware: nominal null & DC guard bins
  null_indices: [0, 1, 2, 3, 4, 5, 32, 59, 60, 61, 62, 63]
  selection_method: "snr"       # Options: 'variance', 'snr', 'pca', 'mean'
  num_selected: 8               # Top subcarriers to retain for processing
  top_k: 8

filter:
  hampel_window_samples: 7
  hampel_n_sigmas: 3.0
  min_deviation_floor: null     # Relative floor used when null
  relative_floor_ratio: 0.05    # 5% of signal robust scale/median
  detrend_method: "linear"      # Options: 'linear', 'mean', 'median'
  detrend_window_sec: 10.0
  bandpass_low_hz: 0.1          # 6 bpm lower bound
  bandpass_high_hz: 0.5         # 30 bpm upper bound
  bandpass_order: 4
  smoothing_method: "savgol"    # Options: 'savgol', 'moving_average'
  smoothing_window_samples: 5
  smoothing_poly_order: 2

estimation:
  window_length_sec: 30.0
  window_stride_sec: 5.0
  fft_zero_pad_factor: 8
  parabolic_interpolation: true
  min_peak_prominence: 0.05
  min_peak_distance_sec: 2.0    # Limits maximum detectable rate to 30 bpm
  min_confidence_score: 35.0
  min_bpm: 6.0
  max_bpm: 30.0

motion:
  short_window_sec: 1.5
  step_sec: 0.5
  multiplier_mad_enter: 3.5
  multiplier_mad_exit: 2.0
  min_duration_sec: 1.0
  mad_low_threshold: 0.04
  mad_high_threshold: 0.12
  window_duration_s: 1.0

state_machine:
  debounce_time_sec: 2.0
  bed_exit_confirmation_sec: 6.0
  empty_bed_variance_threshold: 0.04
  no_data_timeout_sec: 5.0
  empty_bed_threshold: 0.015
  no_person_timeout_s: 5.0
  bed_exit_motion_decay_s: 3.0

display_link:
  enabled: true
  publish_rate_hz: 1.0

logging:
  flush_interval_packets: 100
  max_file_size_mb: 50
